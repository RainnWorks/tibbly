<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0a06" />

    <title>Tibbly. Stop alt-tabbing. Start playing.</title>
    <meta
      name="description"
      content="A live in-game AI co-pilot for Old School RuneScape. Knows your bank, gear, quests, and slayer task. Answers in-client. No more wiki tab-out."
    />

    <!-- Open Graph. og:image is emitted as 1200x630 PNG at build time
         from public/og-card-companion.svg via scripts/build-og.mjs.
         The SVG remains the editable source. The chat-window variant
         (og-card.svg / og-card.png) is rendered alongside and stays
         available for direct linking to the "shape of a chat" demo. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tibbly, your OSRS companion" />
    <meta
      property="og:description"
      content="A small character that walks with you in RuneLite. Watches what you watch. Speaks when there is something to say."
    />
    <meta property="og:image" content="/og-card-companion.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tibbly, a hooded companion who walks beside you in RuneLite, with a speech bubble." />
    <meta property="og:url" content="https://osrs-llm-helper.com" />
    <meta property="og:site_name" content="Tibbly" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tibbly, your OSRS companion" />
    <meta
      name="twitter:description"
      content="A small character that walks with you in RuneLite. Watches what you watch. Speaks when there is something to say."
    />
    <meta name="twitter:image" content="/og-card-companion.png" />
    <meta name="twitter:image:alt" content="Tibbly, a hooded companion who walks beside you in RuneLite, with a speech bubble." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://osrs-llm-helper.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
