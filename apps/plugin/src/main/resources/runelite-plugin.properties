displayName=OSRS LLM Helper
author=thomasnairn
version=0.1.0
description=Outbound LLM chat assistant for OSRS. Pair to a Tibbly account or bring your own provider key.
support=https://github.com/thomasnairn/osrs-llm-helper
tags=chat,assistant,external
warning=This plugin sends in-game state you ask about (player name, stats, inventory, bank contents you query, quest progress, chat input) over TLS to either Tibbly's backend (wss://api.osrsllm.app) or, in BYO mode, directly to your chosen LLM provider (Anthropic, OpenAI, or OpenRouter). The remote provider's terms of service apply to that data. You must opt in via the consent toggle before any data leaves your machine.
plugins=co.rowm.osrsllm.OsrsLlmHelperPlugin
